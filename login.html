<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ================================
         MINIMAL HEADER
         ================================ -->
    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="navbar-logo">CareerConnect</a>
        </div>
    </header>

    <!-- ================================
         LOGIN CARD
         ================================ -->
    <main class="auth-page">
        <div class="auth-card">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Login to your CareerConnect account</p>

            <span id="loginFormError" class="form-error"></span>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmailInput" class="form-label">Email</label>
                    <input type="text" id="loginEmailInput" class="form-input" placeholder="Enter your email">
                    <span id="loginEmailError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="loginPasswordInput" class="form-label">Password</label>
                    <div class="password-field">
                        <input type="password" id="loginPasswordInput" class="form-input" placeholder="Enter your password">
                        <button type="button" id="togglePasswordButton" class="password-toggle-btn">Show</button>
                    </div>
                    <span id="loginPasswordError" class="form-error"></span>
                </div>

                <div class="form-options-row">
                    <label class="remember-me-label">
                        <input type="checkbox" id="rememberMeCheckbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-submit-btn">Login</button>
            </form>

            <p class="auth-footer-text">New user? <a href="signup.html">Create an account</a></p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
